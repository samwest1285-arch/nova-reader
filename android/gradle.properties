# Gradle: Cache auf X: (C: ist zu 100% voll)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Fix: Gradle 8.10 "ExternalDependencyInstrumentingArtifactTransform" Fehler auf Windows
# deaktiviert die Dependency-Instrumentierung (bekanntes Problem mit Dateisperren/Antivirus)
org.gradle.internal.instrumentation.enabled=false

# Cache auf X: verschieben (C: ist voll)
org.gradle.caching=true
