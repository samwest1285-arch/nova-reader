org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Fix: Gradle 8.10 "ExternalDependencyInstrumentingArtifactTransform" Fehler auf Windows
# deaktiviert die Dependency-Instrumentierung (bekanntes Problem mit Dateisperren/Antivirus)
org.gradle.internal.instrumentation.enabled=false
