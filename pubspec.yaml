name: nova_reader
description: A cozy book reader app with earth-tone design, butler character, and AI assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # EPUB reading
  epubx: 4.0.0
  archive: ^3.6.1
  image: ^3.3.0

  # Text-to-speech
  flutter_tts: ^4.0.2

  # Camera & OCR
  google_mlkit_text_recognition: ^0.13.0

  # File & storage
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.2.1

  # Permissions
  permission_handler: ^11.3.1

  # Audio
  audioplayers: ^6.0.0

  # Notifications
  flutter_local_notifications: ^17.2.1+2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
